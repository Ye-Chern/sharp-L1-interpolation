name: Palomar Verification

on:
  push:
    branches: [main, "palomar/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-check:
    name: Check Lean module headers and line caps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Lean source requirements
        run: python3 Lean/scripts/check-lean-sources.py

  comparator:
    name: Build Challenge/Solution and run lake comparator (NanoDa + con-ron)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Lean
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@v1
        with:
          build: false
          lake-package-directory: Lean
      - name: Install bubblewrap for lake comparator's sandbox
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build Challenge, Solution, SharpL1, and run lake comparator
        run: |
          lake exe cache get
          lake build Challenge Solution SharpL1 SharpL1Data.Order03
          ./scripts/verify-comparator.sh
          lake env lean Audit.lean
