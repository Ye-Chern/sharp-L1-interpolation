name: Lean certificate data
on:
  pull_request:
    paths:
      - 'Lean/SharpL1/Certificate/**'
      - 'Lean/SharpL1/Chebyshev.lean'
      - 'Lean/SharpL1/RootBrackets.lean'
      - 'Lean/SharpL1Data.lean'
      - 'Lean/SharpL1Data/**'
      - 'Lean/lakefile.toml'
      - 'Lean/lake-manifest.json'
      - 'Lean/lean-toolchain'
      - 'certificates/brackets.csv'
      - '.github/workflows/lean-data.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  data:
    strategy:
      fail-fast: false
      matrix:
        orders:
          - '03 06 09 12 15'
          - '04 07 10 13 16'
          - '05 08 11 14 17'
          - '18'
          - '19'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: "2"
      ORDERS: ${{ matrix.orders }}
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: Lean
          use-mathlib-cache: "true"
      - name: Check each order with the Lean kernel
        working-directory: Lean
        shell: bash
        run: |
          for order in $ORDERS; do
            lake build "SharpL1Data.Order$order"
          done
