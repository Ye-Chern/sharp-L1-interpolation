        role: "AI collaborator (initial n = 2 derivation)"
      - name: "GPT 6.2 Sol"
        role: "AI collaborator (all-order moving-node operator, v0.1/v0.2 drafts, initial Lean architecture)"
      - name: "Gemini 4 Neon"
        role: "AI collaborator (vertical-chord n >= 4 proof and Python interval verification)"
      - name: "Gemini 4 Hydrogen"
        role: "AI collaborator (Lean 4 formalization coordination, literature audit, and closure)"
    type: "original-proof"
    location: "paper.tex (repository root)"
    relationship: "other"
    note: >-
      Original result presented jointly by this paper and its Lean 4
      formalization: independent rediscovery of the sharp finite-interval all-L^1
      constants and—to the best of our knowledge—the first explicit closed-form
      evaluation B_n = E_n(0) across all n >= 1 resolving Burenkov's (1980) L^1
      open sharpness problem, paired with the moving-node Jacobi operator and
      complete machine-checked proof. See notes/project-history.md and
      notes/literature.md for provenance and primary-source comparisons.
    author_endorsement: "participated"

  - title: "Exact constants in inequalities for norms of intermediate derivatives on a finite interval"
    authors:
      - "V. I. Burenkov"
    id: "Trudy Mat. Inst. Steklov. 156 (1980), 22-29"
    type: "paper"
    location: "https://www.mathnet.ru/eng/tm2408"
    relationship: "background"
    note: >-
      Established the sharp first constant A_n([0,1]) = 4^n n! (§4°) and bounded
      the second constant B(n+1, 1) in [1/12, 1/2] (p. 29 note added in proof);
      explicitly left sharpness of the L^1 constant at n = 1 (eq. (24): 1/2)
      open on p. 27.

  - title: "Exact constants in inequalities for norms of intermediate derivatives on a finite interval. II"
    authors:
      - "V. I. Burenkov"
    id: "Trudy Mat. Inst. Steklov. 173 (1986), 38-49"
    type: "paper"
    location: "https://www.mathnet.ru/eng/tm2147"
    relationship: "background"
    note: >-
      Constructed a rank-one, constant-valued approximating functional (Theorem
      2(1)) matching the spatial average of our moving-node operator T_n, whose
      remainder norm on L^1 is 1/2 on [0,1] (1 on [-1,1]) for all n.

  - title: "Approximation in the mean of classes of differentiable functions by algebraic polynomials"
    authors:
      - "V. A. Kofanov"
    id: "Math. USSR Izv. 23 (1984), no. 2, 353-365"
    type: "paper"
    location: "https://doi.org/10.1070/im1984v023n02abeh001774"
    relationship: "background"
    note: >-
      Determined the best L^1 polynomial approximation error E_n(W_1^(n+1))_1 =
      |s_{n,n+1}(0)| (building on Boyanov 1975), satisfying B_n = 1 - A_n
      E_n(W_1^(n+1))_1 at t = 0 while differing strictly for t != 0 and not
      yielding the upper bound in Theorem 1.

  - title: "Inequalities for Derivatives and Their Applications"
    authors:
      - "V. F. Babenko"
      - "N. P. Korneichuk"
      - "V. A. Kofanov"
      - "S. A. Pichugov"
    type: "book"
    location: "Naukova Dumka, Kiev, 2003"
    relationship: "background"
    note: "General finite-interval additive constant theory and equivalence with Markov-Nikolskii constants."

  - title: "On the Landau--Kolmogorov inequality between ||f'||_infinity, ||f||_infinity and ||f'''||_1"
    authors:
      - "D. Skorokhodov"
    id: "Res. Math. 27 (2019), no. 1, 55-66"
    type: "paper"
    location: "https://doi.org/10.15421/241906"
    relationship: "background"
    note: "Background on Stechkin's optimal operator approximation duality."

