status:
  scope: >-
    Formalizes all four clauses of Theorem 1 in paper.tex unconditionally for
    every integer order n = k + 1 >= 1 and every compact interval [a, b] with
    a < b: (i) existence and uniqueness of the strictly increasing moving
    Jacobi nodes and strict monotonicity E_n'(t) < 0 on (0, 1) with unique
    global maximum E_n(0) = B_n on [-1, 1]; (ii) the sharp W^(n+1,1)([a, b])
    inequality using the 1D iterated-FTC Sobolev characterization SobolevW1;
    (iii) optimality of both constants even over C^infty([a, b]); and (iv)
    exact equality characterization in C^(n+1)([a, b]) as scalar multiples of
    rescaled U_n. Challenge.lean uses a single deliberate sorry on
    SharpL1.theorem_sharp_L1_interpolation_full that is proved unconditionally in
    Solution.lean via SharpL1.Analysis.MainTheorem. Outside Lean scope: prose
    Corollaries 2 (Stechkin L^1-quotient extension) and 3 (contour-integral
    strict monotonicity B_{n+1} > B_n), historical comparisons in
    notes/literature.md, and supplementary observations in
    notes/structural-observations.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "SharpL1.Analysis.theorem_sharp_L1_interpolation_full"
      file: "SharpL1/Analysis/MainTheorem.lean"
      axioms: ["propext", "Classical.choice", "Quot.sound"]

