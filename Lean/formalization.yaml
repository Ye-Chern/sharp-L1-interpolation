# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Sharp Second Constants in L^1 Landau-Kolmogorov Inequalities on a Finite Interval"
  description: >-
    Complete Lean 4 formalization of the lexicographically sharp all-L^1
    Landau-Kolmogorov inequality on any compact interval [a, b] (a < b) and
    every order n = k + 1 >= 1:
    ||f^(n)||_1 <= 4^n n! (b-a)^(-n) ||f||_1 + ((b-a)/2) B_n ||f^(n+1)||_1
    for f in W^(n+1,1)([a,b]), where B_n = 1 - 2^n/(n+1) +
    2^(n+1)/(n+1) sum_{m=1}^{floor((n+1)/2)} (-1)^(m-1) cos^(n+1)(m pi/(n+2)).
    The development constructs the (n+1)-point moving-node Chebyshev divided-
    difference operator driven by the eigenvalues of a symmetric tridiagonal
    Jacobi matrix, proves unconditionally for every n >= 1 that the Peano error
    profile E_n is strictly decreasing on [0, 1] and attains its unique global
    maximum on [-1, 1] at t = 0 with value B_n, proves optimality of both
    constants on C^infty([a,b]), and characterizes equality in C^(n+1)([a,b])
    as scalar multiples of the rescaled second-kind Chebyshev polynomial U_n.
  # PalomarPolicy Leiden Declaration rule: authors and responsible_maintainers
  # MUST list only responsible humans (never AI models or agents).
  authors:
    - "Lijails"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lijails"

