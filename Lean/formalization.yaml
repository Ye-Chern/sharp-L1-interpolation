fidelity:
  divergences: >-
    None in the statement of Theorem 1: Challenge.lean unpacks the exact 1D
    iterated-FTC Sobolev space W^(n+1,1)([a,b]) (eq. (eq:W1-char) / SobolevW1),
    explicit node polynomial roots, and explicit error formula directly over
    Mathlib primitives. Internally in Solution/SharpL1, four proof routes are
    streamlined relative to the paper prose without changing any theorem:
    (1) DividedCDFBridge.lean establishes 0 <= T_n h_t <= 1 and eq. (9)
    algebraically via weighted-exponential CDFs rather than Hermite-Genocchi
    integration; (2) FirstTermPos.lean represents the complex quadratic form via
    paired real Gaussian vectors; (3) ChordIntegral.lean proves the vertical-chord
    identity via Lagrange partial fractions and Complex.log/FTC along the
    Joukowsky loop rather than Fourier inversion; and (4) LowOrderMono.lean
    replaces external mpmath.iv arithmetic for n = 3 with five pure-kernel
    natural-number fixed-point quadrature blocks discharged by decide (depending
    only on propext). Corollaries 2 and 3, historical remarks, and
    notes/structural-observations.md are prose outside Lean scope.

