name = "SharpL1"
version = "0.1.0"
defaultTargets = ["SharpL1"]

[leanOptions]
autoImplicit = false
warningAsError = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "SharpL1"
needs = ["certificateCsv"]

[[input_file]]
name = "certificateCsv"
path = "../certificates/brackets.csv"
text = true

[[lean_lib]]
name = "SharpL1Data"
needs = ["certificateCsv"]
