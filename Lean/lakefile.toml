name = "SharpL1"
version = "0.1.0"
defaultTargets = ["SharpL1", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "SharpL1"
needs = ["certificateCsv"]

[[input_file]]
name = "certificateCsv"
path = "../certificates/brackets.csv"
text = true

[[lean_lib]]
name = "SharpL1Data"
needs = ["certificateCsv"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
